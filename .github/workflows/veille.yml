name: Veille quotidienne

# Chaque matin, récupère les bulletins du CERT-FR et met à jour data/veille.json.
# Le site est republié automatiquement par GitHub Pages à chaque commit sur main.
on:
  schedule:
    - cron: "15 5 * * *"      # tous les jours à 05:15 UTC (≈ 6h15 / 7h15 heure de Paris)
  workflow_dispatch:           # bouton "Run workflow" pour lancer à la main

permissions:
  contents: write              # pour enregistrer data/veille.json dans le dépôt

concurrency:
  group: veille
  cancel-in-progress: false

jobs:
  veille:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Récupérer les bulletins CERT-FR
        run: python scripts/veille.py

      - name: Enregistrer l'historique de veille
        run: |
          git config user.name  "ASALA-374"
          git config user.email "ASALA-374@users.noreply.github.com"
          git add data/veille.json
          git diff --staged --quiet || git commit -m "veille: mise à jour du $(TZ=Europe/Paris date +%F)"
          git push
